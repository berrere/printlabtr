<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PrintLab 3D | Müşteri Portalı - Kuponlu Ürünler & Tüm Kargolar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { background: white; border-radius: 20px; padding: 20px 30px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .logo h1 { color: #667eea; font-size: 1.8rem; }
        .user-info { background: #f0f2f5; padding: 10px 20px; border-radius: 50px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .balance-badge { background: linear-gradient(135deg, #11998e, #38ef7d); color: white; padding: 5px 15px; border-radius: 50px; font-weight: 600; }
        .dashboard-layout { display: flex; gap: 25px; margin-bottom: 30px; flex-wrap: wrap; }
        .main-content { flex: 2; min-width: 280px; }
        .sidebar-coupon { flex: 1; min-width: 280px; }
        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 25px; }
        .card h2 { margin-bottom: 20px; border-left: 4px solid #667eea; padding-left: 15px; }
        .track-form { display: flex; gap: 10px; flex-wrap: wrap; }
        .track-form input { flex: 1; padding: 14px; border: 2px solid #e0e0e0; border-radius: 12px; font-family: monospace; }
        .track-form button { padding: 14px 25px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; }
        .order-card { background: #f8f9fa; border-radius: 16px; padding: 20px; margin-bottom: 15px; border-left: 4px solid #667eea; }
        .order-header { display: flex; justify-content: space-between; flex-wrap: wrap; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #e0e0e0; }
        .tracking-code { font-family: monospace; font-size: 1.2rem; font-weight: 700; color: #667eea; }
        .order-status { display: inline-block; padding: 5px 15px; border-radius: 50px; font-size: 0.8rem; font-weight: 600; }
        .status-beklemede { background: #f39c12; color: white; }
        .status-onaylandi { background: #3498db; color: white; }
        .status-basiliyor { background: #9b59b6; color: white; }
        .status-paketlendi { background: #1abc9c; color: white; }
        .status-hazir { background: #2ecc71; color: white; }
        .status-kargoda { background: #e67e22; color: white; }
        .status-teslim { background: #27ae60; color: white; }
        .status-iptal { background: #e74c3c; color: white; }
        .progress-bar { background: #e0e0e0; border-radius: 20px; height: 8px; margin: 15px 0; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #667eea, #764ba2); height: 100%; border-radius: 20px; transition: width 0.5s; }
        .coupon-products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; margin-top: 15px; }
        .coupon-product-card { background: linear-gradient(135deg, #fff5e6, #ffe8d6); border-radius: 16px; padding: 18px; text-align: center; transition: 0.2s; border: 2px solid #f39c12; position: relative; }
        .coupon-product-card:hover { transform: translateY(-5px); }
        .coupon-badge { position: absolute; top: -10px; right: -10px; background: #f39c12; color: white; padding: 5px 12px; border-radius: 50px; font-size: 0.7rem; }
        .product-image { font-size: 3rem; margin-bottom: 10px; }
        .product-name { font-weight: 700; font-size: 1.1rem; }
        .product-price { font-size: 1.4rem; font-weight: 800; color: #e67e22; margin: 10px 0; }
        .shipping-note { font-size: 0.7rem; color: #e74c3c; margin: 8px 0; padding: 5px; background: #fff0f0; border-radius: 8px; }
        .cargo-select { width: 100%; padding: 8px; border-radius: 10px; border: 1px solid #ddd; margin: 10px 0; }
        .buy-coupon-btn { background: #f39c12; color: white; border: none; padding: 10px; border-radius: 25px; width: 100%; font-weight: 600; cursor: pointer; }
        .buy-coupon-btn:hover { background: #e67e22; }
        .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #ddd; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        button { padding: 8px 16px; border-radius: 25px; border: none; cursor: pointer; font-weight: 600; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; padding: 15px; background: #f0f2f5; border-radius: 16px; }
        .filter-bar input, .filter-bar select { padding: 10px; border: 1px solid #ddd; border-radius: 10px; flex: 1; min-width: 120px; }
        .notification-toast { position: fixed; top: 20px; right: 20px; background: white; border-radius: 12px; padding: 15px 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 12px; z-index: 2000; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 20px; padding: 30px; max-width: 500px; width: 90%; }
        footer { text-align: center; margin-top: 30px; color: white; opacity: 0.8; }
        @media (max-width: 900px) { .dashboard-layout { flex-direction: column; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><h1><i class="fas fa-cube"></i> PrintLab 3D Pro</h1><p>Müşteri Portalı | Tüm Kargo Firmaları</p></div>
        <div class="user-info"><i class="fas fa-user-circle fa-2x"></i><div><div id="userNameDisplay">Misafir</div><div id="userBalanceDisplay" class="balance-badge">💰 Bakiye: 0 ₺</div></div><button id="logoutBtn" style="background:#e74c3c; padding:5px 12px; border-radius:25px; display:none;">Çıkış</button></div>
    </div>

    <div class="dashboard-layout">
        <div class="main-content">
            <div class="card"><h2><i class="fas fa-search"></i> Sipariş Takip</h2><div class="track-form"><input type="text" id="trackingInput" placeholder="Takip Kodu (PL3D-XXXXXX)"><button id="trackBtn"><i class="fas fa-search"></i> Sorgula</button></div><div id="trackResult" style="margin-top:20px;"></div></div>
            <div class="card"><h2><i class="fas fa-filter"></i> Sipariş Filtreleme</h2><div class="filter-bar"><input type="date" id="filterDateStart"><input type="date" id="filterDateEnd"><select id="filterStatus"><option value="all">Tüm Durumlar</option><option value="beklemede">Beklemede</option><option value="onaylandi">Onaylandı</option><option value="basiliyor">Basılıyor</option><option value="paketlendi">Paketlendi</option><option value="hazir">Hazır</option><option value="kargoda">Kargoda</option><option value="teslim">Teslim</option><option value="iptal">İptal</option></select><button id="applyFilterBtn" class="btn-primary">Filtrele</button><button id="resetFilterBtn">Sıfırla</button></div><div id="orderHistory"></div></div>
        </div>
        <div class="sidebar-coupon">
            <div class="card" style="background:linear-gradient(135deg,#fff9f0,#fff0e0);"><h2><i class="fas fa-ticket-alt"></i> 🏷️ Kuponlu Ürünler</h2><p style="font-size:0.85rem; margin-bottom:15px; color:#e67e22;"><i class="fas fa-info-circle"></i> Kupon bakiyenizle indirimli alışveriş! Kargo ve KDV size aittir.</p><div id="couponProductsList"></div><div id="purchaseResult" style="margin-top:15px;"></div></div>
        </div>
    </div>
    <footer><p><i class="fas fa-truck"></i> Kargo Seçenekleri: Sürat Kargo | UPS | Aras | Hepsijet | PTT | Kolay Gelsin</p></footer>
</div>

<script>
    const JSONBIN_API_KEY = "$2a$10$f2TAysXUZVVJuURIPehcd.PCfD3lyFn/3/QcNSyovFLrtsooQqCrq";
    const JSONBIN_BIN_ID = "6a21a9a1f5f4af5e29b927a2";
    let customers = [], orders = [], couponProducts = [], currentCustomer = null;
    let cargoPrices = { "Sürat Kargo":45,"UPS Kargo":55,"Aras Kargo":50,"Hepsijet Kargo":48,"PTT Kargo":40,"Kolay Gelsin Kargo":35 };
    let taxRate = 18;
    let filters = { startDate:null, endDate:null, status:'all' };
    
    const statusText = { 'beklemede':{text:'⏳ Beklemede',progress:10},'onaylandi':{text:'✅ Onaylandı',progress:25},'basiliyor':{text:'🖨️ Basılıyor',progress:45},'paketlendi':{text:'📦 Paketlendi',progress:65},'hazir':{text:'🎯 Gönderilmeye Hazır',progress:80},'kargoda':{text:'🚚 Kargoda',progress:90},'teslim':{text:'🏠 Teslim Edildi',progress:100},'iptal':{text:'❌ İptal Edildi',progress:0} };
    
    async function loadData() {
        try { const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`,{ headers:{'X-Master-Key':JSONBIN_API_KEY} });
            if(res.ok){ const data=await res.json(); if(data.record){ customers=data.record.customers||[]; orders=data.record.orders||[]; couponProducts=data.record.couponProducts||[]; if(data.record.cargoPrices) cargoPrices=data.record.cargoPrices; if(data.record.taxRate) taxRate=data.record.taxRate; } }
        } catch(e){ console.error(e); }
        const lastId = localStorage.getItem('last_customer_id');
        if(lastId) { const cust = customers.find(c=>c.id==lastId); if(cust) loginCustomer(cust.id); }
        renderCouponProducts();
        renderOrderHistory();
    }
    
    function loginCustomer(customerId) { currentCustomer = customers.find(c=>c.id===customerId); if(currentCustomer){ document.getElementById('userNameDisplay').innerHTML=`<i class="fas fa-user"></i> ${currentCustomer.name}`; document.getElementById('userBalanceDisplay').innerHTML=`💰 Bakiye: ${currentCustomer.balance.toFixed(2)} ₺`; document.getElementById('logoutBtn').style.display='inline-block'; renderOrderHistory(); renderCouponProducts(); localStorage.setItem('last_customer_id',customerId); } }
    function logout(){ currentCustomer=null; document.getElementById('userNameDisplay').innerHTML='Misafir'; document.getElementById('userBalanceDisplay').innerHTML='💰 Bakiye: 0 ₺'; document.getElementById('logoutBtn').style.display='none'; document.getElementById('orderHistory').innerHTML='<p>Siparişlerinizi görmek için takip kodu girin.</p>'; renderCouponProducts(); localStorage.removeItem('last_customer_id'); }
    
    function trackOrder(code){ const order=orders.find(o=>o.trackingCode===code); const div=document.getElementById('trackResult'); if(!order){ div.innerHTML=`<div class="error-message" style="padding:10px; background:#ffebee; border-radius:12px;">❌ Takip kodu bulunamadı!</div>`; return; }
        const cust=customers.find(c=>c.id===order.customerId); if(cust&&(!currentCustomer||currentCustomer.id!==cust.id)) loginCustomer(cust.id);
        const st=statusText[order.status]||statusText['beklemede'];
        div.innerHTML=`<div class="order-card"><div class="order-header"><span class="tracking-code">${order.trackingCode}</span><span class="order-status status-${order.status}">${st.text}</span></div>
        <div class="detail-row"><span>Ürün:</span><strong>${order.product}</strong></div><div class="detail-row"><span>Ürün Tutarı:</span><strong>${order.amount.toFixed(2)} ₺</strong></div>
        <div class="detail-row"><span>Kargo (${order.cargoCompany||'Sürat Kargo'}):</span><strong>${(order.cargoPrice||45).toFixed(2)} ₺</strong></div>
        <div class="detail-row"><span>Toplam:</span><strong>${((order.amount||0)+(order.cargoPrice||45)).toFixed(2)} ₺</strong></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${st.progress}%;"></div></div></div>`;
    }
    
    function renderOrderHistory(){ if(!currentCustomer){ document.getElementById('orderHistory').innerHTML='<p>Siparişlerinizi görmek için takip kodu girin veya giriş yapın.</p>'; return; }
        let filtered=orders.filter(o=>o.customerId===currentCustomer.id);
        if(filters.startDate) filtered=filtered.filter(o=>new Date(o.createdAt)>=new Date(filters.startDate));
        if(filters.endDate) filtered=filtered.filter(o=>new Date(o.createdAt)<=new Date(filters.endDate));
        if(filters.status!=='all') filtered=filtered.filter(o=>o.status===filters.status);
        if(filtered.length===0){ document.getElementById('orderHistory').innerHTML='<p>Filtreye uygun sipariş yok.</p>'; return; }
        document.getElementById('orderHistory').innerHTML=filtered.map(o=>{ const st=statusText[o.status]||statusText['beklemede']; return `<div class="order-card"><div class="order-header"><span class="tracking-code">${o.trackingCode}</span><span class="order-status status-${o.status}">${st.text}</span></div>
        <div class="detail-row"><span>Ürün:</span><strong>${o.product}</strong></div><div class="detail-row"><span>Tutar:</span><strong>${o.amount.toFixed(2)} ₺</strong></div>
        <div class="detail-row"><span>Kargo:</span><strong>${o.cargoCompany||'Sürat Kargo'} (${(o.cargoPrice||45).toFixed(2)} ₺)</strong></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${st.progress}%;"></div></div>
        <button class="track-again" data-code="${o.trackingCode}" style="margin-top:10px; padding:5px 12px; background:#667eea; color:white; border:none; border-radius:20px;">Detaylı Takip</button></div>`; }).join('');
        document.querySelectorAll('.track-again').forEach(btn=>btn.addEventListener('click',()=>{ trackOrder(btn.dataset.code); document.getElementById('trackResult').scrollIntoView({behavior:'smooth'}); }));
    }
    
    async function purchaseWithCoupon(product, price, cargoCompany, cargoPrice){
        if(!currentCustomer){ alert("Lütfen önce giriş yapın!"); return; }
        const totalAmount = price + cargoPrice;
        if(currentCustomer.balance < totalAmount){ alert(`Yetersiz bakiye! Gerekli: ${totalAmount} ₺, Bakiyeniz: ${currentCustomer.balance} ₺`); return; }
        currentCustomer.balance -= totalAmount;
        const idx = customers.findIndex(c=>c.id===currentCustomer.id);
        if(idx!==-1) customers[idx].balance = currentCustomer.balance;
        const newCode = 'PL3D-' + Math.random().toString(36).substring(2,8).toUpperCase();
        const newOrder = { id:Date.now(), trackingCode:newCode, customerId:currentCustomer.id, customerName:currentCustomer.name, product:product.name, amount:price, cargoCompany:cargoCompany, cargoPrice:cargoPrice, totalAmount:totalAmount, status:"onaylandi", estimatedDays:3, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
        orders.push(newOrder);
        await saveToJSONBin();
        document.getElementById('userBalanceDisplay').innerHTML = `💰 Bakiye: ${currentCustomer.balance.toFixed(2)} ₺`;
        renderOrderHistory();
        document.getElementById('purchaseResult').innerHTML = `<div class="info-message">✅ Satın alındı! Takip kodunuz: <strong>${newCode}</strong><br>Kargo: ${cargoCompany} (${cargoPrice}₺)</div>`;
        document.getElementById('trackingInput').value = newCode;
        trackOrder(newCode);
        setTimeout(()=>document.getElementById('purchaseResult').innerHTML='', 8000);
    }
    
    function renderCouponProducts(){
        const container = document.getElementById('couponProductsList');
        if(!currentCustomer){ container.innerHTML = '<p>Kuponlu ürünleri görmek için giriş yapın.</p>'; return; }
        if(couponProducts.length===0){ container.innerHTML = '<p>Henüz kuponlu ürün bulunmuyor.</p>'; return; }
        container.innerHTML = `<div class="coupon-products-grid">${couponProducts.map(p=>`<div class="coupon-product-card"><div class="coupon-badge">🎫 KUPONLU</div><div class="product-image">${p.image.includes('fa-')?`<i class="fas ${p.image} fa-3x"></i>`:(p.image.length<5?p.image:'📦')}</div><div class="product-name">${p.name}</div><div class="product-price">${p.price.toFixed(2)} ₺</div><div class="shipping-note"><i class="fas fa-exclamation-triangle"></i> Kargo ve KDV size aittir!</div><select class="cargo-select" data-product-id="${p.id}"><option value="Sürat Kargo">🚀 Sürat Kargo (${cargoPrices["Sürat Kargo"]}₺)</option><option value="UPS Kargo">📦 UPS Kargo (${cargoPrices["UPS Kargo"]}₺)</option><option value="Aras Kargo">🚛 Aras Kargo (${cargoPrices["Aras Kargo"]}₺)</option><option value="Hepsijet Kargo">✈️ Hepsijet Kargo (${cargoPrices["Hepsijet Kargo"]}₺)</option><option value="PTT Kargo">🏤 PTT Kargo (${cargoPrices["PTT Kargo"]}₺)</option><option value="Kolay Gelsin Kargo">😊 Kolay Gelsin Kargo (${cargoPrices["Kolay Gelsin Kargo"]}₺)</option></select><button class="buy-coupon-btn" data-id="${p.id}" data-price="${p.price}" data-name="${p.name}"><i class="fas fa-shopping-cart"></i> Kuponla Satın Al</button></div>`).join('')}</div>`;
        document.querySelectorAll('.buy-coupon-btn').forEach(btn=>btn.addEventListener('click',()=>{ const id=parseInt(btn.dataset.id), price=parseFloat(btn.dataset.price), name=btn.dataset.name, product=couponProducts.find(p=>p.id===id), cargoSelect=document.querySelector(`.cargo-select[data-product-id="${id}"]`), cargoCompany=cargoSelect.value, cargoPrice=cargoPrices[cargoCompany]; purchaseWithCoupon(product, price, cargoCompany, cargoPrice); }));
    }
    
    async function saveToJSONBin(){ const data={customers,orders,couponProducts,cargoPrices,taxRate}; try{ await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`,{method:'PUT',headers:{'X-Master-Key':JSONBIN_API_KEY,'Content-Type':'application/json'},body:JSON.stringify(data)}); }catch(e){} }
    
    document.getElementById('trackBtn').addEventListener('click',()=>{ const code=document.getElementById('trackingInput').value.trim().toUpperCase(); if(code) trackOrder(code); else alert('Takip kodu girin!'); });
    document.getElementById('logoutBtn').addEventListener('click',logout);
    document.getElementById('applyFilterBtn').addEventListener('click',()=>{ filters.startDate=document.getElementById('filterDateStart').value; filters.endDate=document.getElementById('filterDateEnd').value; filters.status=document.getElementById('filterStatus').value; renderOrderHistory(); });
    document.getElementById('resetFilterBtn').addEventListener('click',()=>{ document.getElementById('filterDateStart').value=''; document.getElementById('filterDateEnd').value=''; document.getElementById('filterStatus').value='all'; filters={startDate:null,endDate:null,status:'all'}; renderOrderHistory(); });
    document.getElementById('trackingInput').addEventListener('keypress',(e)=>{ if(e.key==='Enter') document.getElementById('trackBtn').click(); });
    
    loadData();
</script>
</body>
</html>
